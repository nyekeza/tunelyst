name: Suggest an improvement
description: Share an idea for Tunelyst.
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea in a few words.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: How would it help?
      description: Tell us what would make it useful to you.
    validations:
      required: false
