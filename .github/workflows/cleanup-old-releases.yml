name: Remove superseded Android releases

on:
  push:
    tags:
      - cleanup-v1.1.56-history

permissions:
  contents: write

jobs:
  remove-superseded-releases:
    name: Remove v1.1.54 and v1.1.55 releases
    runs-on: ubuntu-latest
    steps:
      - name: Delete older releases, assets, and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "cleanup-v1.1.56-history" ]]; then
            echo "::error::Unexpected cleanup tag: $GITHUB_REF_NAME"
            exit 1
          fi

          for tag in v1.1.54 v1.1.55; do
            if release_id="$(gh api "repos/$REPOSITORY/releases/tags/$tag" --jq '.id' 2>/dev/null)"; then
              gh api --method DELETE "repos/$REPOSITORY/releases/$release_id"
              echo "Deleted release $tag and its assets."
            else
              echo "Release $tag was already absent."
            fi

            if gh api "repos/$REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$REPOSITORY/git/refs/tags/$tag"
              echo "Deleted tag $tag."
            else
              echo "Tag $tag was already absent."
            fi
          done
