name: Android checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run Android lint
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon lintDebug 2>&1 | tee "$RUNNER_TEMP/lint-debug.log"

      - name: Report Android lint errors
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("app/build/reports/lint-results*.xml"))
          if not reports:
              print("::warning title=Android lint report::No lint XML report was produced.")
              raise SystemExit(0)

          def escape_data(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def escape_property(value):
              return escape_data(value).replace(":", "%3A").replace(",", "%2C")

          for report in reports:
              root = ET.parse(report).getroot()
              for issue in root.iter("issue"):
                  severity = issue.attrib.get("severity", "warning").lower()
                  if severity not in ("error", "fatal"):
                      continue
                  location = issue.find("location")
                  if location is None:
                      continue
                  source = location.attrib.get("file")
                  if not source:
                      continue
                  if os.path.isabs(source):
                      source = os.path.relpath(source, os.getcwd())
                  line = location.attrib.get("line")
                  message = issue.attrib.get("message", issue.attrib.get("id", "Android lint error"))
                  title = issue.attrib.get("id", "Android lint")
                  properties = f"file={escape_property(source)},title={escape_property(title)}"
                  if line:
                      properties += f",line={escape_property(line)}"
                  print(f"::error {properties}::{escape_data(message)}")
          PY

      - name: Run unit tests and build the debug app
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/verify-build.log"

      - name: Capture Gradle failure details
        if: failure()
        shell: bash
        run: |
          for log in "$RUNNER_TEMP/lint-debug.log" "$RUNNER_TEMP/verify-build.log"; do
            if [[ -f "$log" ]]; then
              {
                echo "### $(basename "$log")"
                echo
                echo '```text'
                tail -n 100 "$log"
                echo '```'
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          python3 - "$RUNNER_TEMP/lint-debug.log" "$RUNNER_TEMP/verify-build.log" <<'PY'
          import os
          import sys

          for path in sys.argv[1:]:
              if not os.path.isfile(path):
                  continue
              with open(path, encoding="utf-8", errors="replace") as log:
                  excerpt = "".join(log.readlines()[-60:]).strip()
              if not excerpt:
                  continue
              excerpt = excerpt[-12000:]
              escaped = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Gradle failure log::{os.path.basename(path)}%0A{escaped}")
          PY

  instrumentation:
    name: Android ${{ matrix.api-level }} instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            emulator_target: default
          - api-level: 36
            emulator_target: google_apis
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run instrumented tests on an Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.emulator_target }}
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          script: >-
            bash -o pipefail -c 'bash ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace 2>&1 |
            tee "$RUNNER_TEMP/connectedDebugAndroidTest.log"'
      - name: Report instrumented test failures
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob("app/build/outputs/androidTest-results/connected/**/TEST-*.xml", recursive=True)
          if not reports:
              print("::warning title=Android test reports::No instrumentation XML reports were produced; emulator startup or test installation may have failed.")
              raise SystemExit(0)

          found_failure = False
          for path in sorted(reports):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      issue = case.find(tag)
                      if issue is None:
                          continue
                      found_failure = True
                      detail = (issue.attrib.get("message", "") + " " + (issue.text or "")).strip()
                      detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      name = f"{case.attrib.get('classname', 'test')}.{case.attrib.get('name', 'unknown')}"
                      print(f"::error title=Instrumented test failure::{name}: {detail[:800]}")

          if not found_failure:
              print("All instrumentation test XML reports show zero failures.")
          PY

      - name: Capture emulator diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "### Emulator diagnostics (API ${{ matrix.api-level }})"
            echo
            echo '```text'
            if [[ -f "$RUNNER_TEMP/connectedDebugAndroidTest.log" ]]; then
              echo 'Gradle output (last 100 lines):'
              tail -n 100 "$RUNNER_TEMP/connectedDebugAndroidTest.log"
              echo
            fi
            echo '$ adb devices -l'
            adb devices -l 2>&1
            echo
            echo '$ emulator -list-avds'
            emulator -list-avds 2>&1
            device_ids="$(adb devices 2>/dev/null | awk '$2 == "device" { print $1 }')"
            for device in $device_ids; do
              echo
              echo "Device: $device"
              echo '$ adb shell getprop sys.boot_completed'
              timeout 15s adb -s "$device" shell getprop sys.boot_completed 2>&1
              echo '$ adb shell getprop ro.build.version.sdk'
              timeout 15s adb -s "$device" shell getprop ro.build.version.sdk 2>&1
              echo 'Last 300 logcat lines:'
              timeout 15s adb -s "$device" logcat -d -v threadtime -t 300 2>&1 | tail -n 300
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f "$RUNNER_TEMP/connectedDebugAndroidTest.log" ]]; then
            python3 - "$RUNNER_TEMP/connectedDebugAndroidTest.log" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8", errors="replace") as log:
              excerpt = "".join(log.readlines()[-60:]).strip()
          if excerpt:
              excerpt = excerpt[-12000:]
              escaped = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Instrumentation failure log::{os.path.basename(path)}%0A{escaped}")
          PY
          fi
